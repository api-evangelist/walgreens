naftiko: "1.0.0-alpha1"

info:
  label: "Walgreens Store Locator API"
  description: >-
    Shared capability definition for the Walgreens Store Locator API. Provides
    store search by geolocation, address, or zip code with service filtering,
    store details retrieval, and complete store number enumeration across
    8,000+ Walgreens and Duane Reade locations.
  tags:
    - Walgreens
    - Store Locator
    - Retail
    - Pharmacy
    - Geolocation
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WALGREENS_API_KEY: WALGREENS_API_KEY
      WALGREENS_AFFILIATE_ID: WALGREENS_AFFILIATE_ID

capability:
  consumes:
    - type: http
      namespace: walgreens-store-locator
      baseUri: https://services.walgreens.com
      description: "Walgreens store location search and details API"
      authentication:
        type: apikey
        key: apiKey
        value: "{{WALGREENS_API_KEY}}"
        placement: body
      resources:
        - name: store-search
          path: /api/stores/search/v2
          description: "Search Walgreens stores by location"
          operations:
            - name: search-stores
              method: POST
              description: "Search for Walgreens stores by geolocation, address, or zip code"
              inputParameters:
                - name: lat
                  in: body
                  type: number
                  required: false
                  description: "Latitude coordinate for search"
                - name: lng
                  in: body
                  type: number
                  required: false
                  description: "Longitude coordinate for search"
                - name: address
                  in: body
                  type: string
                  required: false
                  description: "Street address for search"
                - name: zip
                  in: body
                  type: string
                  required: false
                  description: "Zip code for search"
                - name: r
                  in: body
                  type: integer
                  required: true
                  description: "Search radius in miles"
                - name: s
                  in: body
                  type: integer
                  required: true
                  description: "Items per page"
                - name: p
                  in: body
                  type: integer
                  required: true
                  description: "Page number"
                - name: filterOptions
                  in: body
                  type: array
                  required: false
                  description: "Service filter options"
              outputRawFormat: json
              outputParameters:
                - name: results
                  type: array
                  value: "$.results"
        - name: store-details
          path: /api/stores/details/v1
          description: "Get detailed information for a specific store"
          operations:
            - name: get-store-details
              method: POST
              description: "Retrieve comprehensive details for a specific Walgreens store"
              inputParameters:
                - name: storeNo
                  in: body
                  type: string
                  required: true
                  description: "Store number to query"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: store-numbers
          path: /api/util/storenumber/v1
          description: "Get all store numbers"
          operations:
            - name: list-store-numbers
              method: POST
              description: "Retrieve complete list of all Walgreens store numbers"
              inputParameters:
                - name: act
                  in: body
                  type: string
                  required: true
                  description: "Always set to storenumber"
              outputRawFormat: json
              outputParameters:
                - name: store
                  type: array
                  value: "$.store"

  exposes:
    - type: rest
      port: 8110
      namespace: walgreens-store-locator-api
      resources:
        - path: /v1/stores
          name: stores
          description: "Search and retrieve Walgreens store locations"
          operations:
            - method: POST
              name: search-stores
              description: "Search stores by location"
              call: "walgreens-store-locator.search-stores"
              outputParameters:
                - type: array
                  mapping: "$.results"
        - path: /v1/stores/{storeNo}
          name: store-detail
          description: "Get a specific store's details"
          operations:
            - method: GET
              name: get-store-details
              description: "Get store details by store number"
              call: "walgreens-store-locator.get-store-details"
              with:
                storeNo: "rest.storeNo"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/store-numbers
          name: store-numbers
          description: "List all store numbers"
          operations:
            - method: GET
              name: list-store-numbers
              description: "Get all Walgreens store numbers"
              call: "walgreens-store-locator.list-store-numbers"
              outputParameters:
                - type: array
                  mapping: "$.store"

    - type: mcp
      port: 9110
      namespace: walgreens-store-locator-mcp
      transport: http
      tools:
        - name: search-walgreens-stores
          description: "Search for Walgreens store locations near a given address, zip code, or coordinates"
          hints:
            readOnly: true
            openWorld: true
          call: "walgreens-store-locator.search-stores"
          with:
            lat: "tools.lat"
            lng: "tools.lng"
            address: "tools.address"
            zip: "tools.zip"
            r: "tools.radius"
            s: "tools.pageSize"
            p: "tools.page"
          outputParameters:
            - type: array
              mapping: "$.results"
        - name: get-walgreens-store-details
          description: "Get detailed information for a specific Walgreens store by store number"
          hints:
            readOnly: true
            openWorld: false
          call: "walgreens-store-locator.get-store-details"
          with:
            storeNo: "tools.storeNo"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-all-store-numbers
          description: "Get the complete list of all Walgreens store numbers"
          hints:
            readOnly: true
            openWorld: false
          call: "walgreens-store-locator.list-store-numbers"
          outputParameters:
            - type: array
              mapping: "$.store"
