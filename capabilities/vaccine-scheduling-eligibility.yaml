naftiko: 1.0.0-alpha2
info:
  label: Walgreens Vaccine Scheduling API — Eligibility
  description: 'Walgreens Vaccine Scheduling API — Eligibility. 1 operations. Lead operation: Check Vaccine Eligibility. Self-contained
    Naftiko capability covering one Walgreens business surface.'
  tags:
  - Walgreens
  - Eligibility
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WALGREENS_API_KEY: WALGREENS_API_KEY
capability:
  consumes:
  - type: http
    namespace: vaccine-scheduling-eligibility
    baseUri: https://services.walgreens.com
    description: Walgreens Vaccine Scheduling API — Eligibility business capability. Self-contained, no shared references.
    resources:
    - name: api-vaccine-scheduling-eligibility-v1
      path: /api/vaccine/scheduling/eligibility/v1
      operations:
      - name: checkvaccineeligibility
        method: POST
        description: Check Vaccine Eligibility
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: apiKey
      value: '{{env.WALGREENS_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: vaccine-scheduling-eligibility-rest
    port: 8080
    description: REST adapter for Walgreens Vaccine Scheduling API — Eligibility. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/vaccine/scheduling/eligibility/v1
      name: api-vaccine-scheduling-eligibility-v1
      description: REST surface for api-vaccine-scheduling-eligibility-v1.
      operations:
      - method: POST
        name: checkvaccineeligibility
        description: Check Vaccine Eligibility
        call: vaccine-scheduling-eligibility.checkvaccineeligibility
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vaccine-scheduling-eligibility-mcp
    port: 9090
    transport: http
    description: MCP adapter for Walgreens Vaccine Scheduling API — Eligibility. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: check-vaccine-eligibility
      description: Check Vaccine Eligibility
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: vaccine-scheduling-eligibility.checkvaccineeligibility
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
