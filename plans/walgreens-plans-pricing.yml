description: The Walgreens Developer Program (developer.walgreens.com) lists
  several APIs (Photo Prints, Rx Refill / Transfer, Scheduling, Add to Cart,
  Store Inventory, Store Locator) but does not publish a tiered pricing model
  or self-service paid plans. API key issuance is approval-based, and the
  primary commercial relationship for monetized APIs (e.g. Photo Prints) is a
  revenue-share commission rather than a metered subscription. Trimmed to a
  single Contact Developer Program plan because no public price list exists.
sources:
  - https://developer.walgreens.com/
  - https://developer.walgreens.com/apis
notes: No published pricing tiers. Developer access is via approval and an API
  key, with a revenue-share model for monetizable APIs (Photo Prints) and no
  per-call list price visible publicly.
plans:
  - id: walgreens-developer-program
    name: Walgreens Developer Program
    type: enterprise
    description: Approval-gated developer program providing access to Walgreens
      partner APIs (Photo Prints, Rx Refill, Scheduling, Store Locator, Store
      Inventory, Add to Cart). Commercial terms are negotiated per integration;
      Photo Prints includes a revenue-share commission for successful orders.
    entries:
