info:
  title: Walgreens API Vocabulary
  description: >-
    Vocabulary and taxonomy for the Walgreens Developer API covering pharmacy,
    healthcare, vaccine scheduling, store operations, and retail commerce domains.
  version: 1.0.0
  created: '2026-05-03'
  modified: '2026-05-03'

domains:
  - name: Pharmacy
    description: Prescription management and pharmaceutical services
    terms:
      - term: Prescription
        definition: A written order from a licensed healthcare provider authorizing the dispensing of a specific medication
        synonyms: [Rx, Script, Med Order]
      - term: Refill
        definition: Re-dispensing a previously filled prescription when remaining doses are consumed
        synonyms: [Rx Refill, Prescription Refill]
      - term: Transfer
        definition: Moving a prescription from one pharmacy to another pharmacy for continued dispensing
        synonyms: [Rx Transfer, Prescription Transfer]
      - term: NPI Code
        definition: National Provider Identifier, a unique 10-digit identification number for covered healthcare providers
        abbreviation: NPI
      - term: RxNo
        definition: The unique prescription number assigned by the dispensing pharmacy
        synonyms: [Prescription Number, Rx Number]

  - name: Vaccine Scheduling
    description: Immunization appointment booking terminology
    terms:
      - term: Engagement
        definition: A vaccine appointment booking session identified by a unique engagementId, progressing through hold, patient attachment, and confirmation steps
      - term: Engagement ID
        definition: Unique identifier for a vaccine appointment engagement session
      - term: Eligibility
        definition: Determination of whether a patient qualifies for a specific vaccine based on age, state, and medical criteria
      - term: Timeslot
        definition: A specific available appointment time at a Walgreens location for vaccine administration
      - term: Hold
        definition: Temporary reservation of a vaccine timeslot pending patient registration and confirmation
      - term: Vaccine Code
        definition: CDC-assigned standardized code identifying a specific vaccine product (e.g. 207 for COVID-19 mRNA)
      - term: Dose Series
        definition: The sequence of doses required for a multi-dose vaccine regimen
      - term: SMS Consent
        definition: Patient's agreement to receive appointment reminders via text message

  - name: Store Operations
    description: Retail store and location terminology
    terms:
      - term: Store Number
        definition: Unique numeric identifier assigned to each Walgreens or Duane Reade retail location
      - term: Affiliate ID
        definition: Identifier assigned to a third-party API partner by Walgreens Developer Program
        abbreviation: affId
      - term: Service Indicator
        definition: A code indicating an available service type at a specific store location
      - term: Emergency Status
        definition: Indicator showing whether a store is operating under emergency conditions affecting hours or services
      - term: Drive-Thru Pharmacy
        definition: Pharmacy window accessible by vehicle without entering the store building
      - term: 24-Hour Pharmacy
        definition: Pharmacy location with round-the-clock dispensing operations
      - term: Healthcare Clinic
        definition: In-store clinical care location offering nurse practitioner and physician assistant services

  - name: Retail Commerce
    description: Shopping, products, and digital offers terminology
    terms:
      - term: Add to Cart
        definition: API operation enabling third-party applications to place Walgreens.com products into a customer's shopping cart
      - term: Store Inventory
        definition: Real-time product availability and stock levels at a specific store location
      - term: Digital Offer
        definition: Electronic coupon or promotional discount accessible via the Walgreens API
      - term: Photo Print
        definition: Physical print of a digital photo available for same-day pickup at Walgreens stores

