method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Pharmacy
  - Retail
  - Healthcare
  - Rate Limiting
description: Walgreens does not publish numeric rate-limit thresholds for its
  Developer Program APIs (Photo Prints, Rx Refill, Scheduling, Store Locator,
  Store Inventory, Add to Cart). Limits, response codes, and headers are
  documented in approval-gated reference material distributed after API key
  issuance. Trimmed scaffold; no public throttling surface.
sources:
  - https://developer.walgreens.com/
  - https://developer.walgreens.com/apis
notes: No public per-second / per-day rate-limit numbers. Approved partners
  receive limits as part of their integration agreement.
limits:
  - name: Walgreens Partner APIs
    scope: api-key
    metric: varies
    limit: see partner integration agreement
    notes: Specific thresholds are issued with the approved API key; not
      publicly documented.
policies:
  - name: Approval-Gated Access
    description: API keys are issued only after the partner application is
      approved. Throttling thresholds and any per-endpoint limits are
      communicated as part of that onboarding.
  - name: Backoff and Retry
    description: Standard practice is exponential backoff with jitter when
      the API returns 429.
